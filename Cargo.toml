[package]
name = "harper_c"
version = "0.1.0"
edition = "2021"
authors = ["Maxwell Authors"]
license = "MIT"
description = "C-ABI and Odin bindings for the Harper grammar checker"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
harper-core = { version = "2.11.0", default-features = false, features = ["concurrent"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
